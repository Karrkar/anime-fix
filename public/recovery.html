<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление — Anime Platforma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0f0f13; color: #e5e7eb;
      font-family: system-ui, -apple-system, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
    .spin { width: 46px; height: 46px; border: 3px solid rgba(168,85,247,.25);
      border-top-color: #a855f7; border-radius: 50%; animation: sp 1s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 700; }
    p { font-size: 14px; color: #9ca3af; max-width: 420px; line-height: 1.5; }
    .ok { color: #34d399; }
    .btn { display: inline-block; margin-top: 8px; padding: 12px 28px; border: none;
      border-radius: 10px; background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: #fff; font-size: 15px; font-weight: 600; text-decoration: none; }
    .log { font-size: 12px; color: #6b7280; min-height: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin" id="spin"></div>
    <h1>Очищаю старые данные платформы…</h1>
    <p id="msg">Убираю застрявшую версию из браузера. Это займёт пару секунд — вход в аккаунт сохранится.</p>
    <div class="log" id="log"></div>
    <a class="btn" id="go" href="/" style="display:none">Открыть платформу</a>
  </div>
  <script>
  // РЕАНИМАТОР КЭША (26.10.2026). Эта страница доезжает до браузера свежей
  // ВСЕГДА: новый URL отсутствует во всех кэшах цепочки (Cloudflare, прокси
  // оператора, HTTP-кэш браузера, Cache Storage старых service worker'ов).
  // Вычищаем SW и кэши вручную — login не трогаем (httpOnly cookie недоступны
  // из JS, localStorage с легаси-токеном не очищаем).
  (function () {
    var log = document.getElementById('log');
    var done = 0, total = 3;
    function tick(msg) { log.textContent = msg; }
    function finish() {
      done++;
      if (done >= total) {
        document.getElementById('spin').style.display = 'none';
        document.getElementById('msg').className = 'ok';
        document.getElementById('msg').textContent = 'Готово! Старая версия удалена.';
        tick('Перенаправляю на платформу…');
        setTimeout(function () { location.replace('/'); }, 800);
      }
    }

    // 1. Снять ВСЕ service worker'ы (включая древние ap-v1..v7)
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) { tick('Service worker’ы не найдены'); return finish(); }
          return Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () { tick('Снято SW: ' + regs.length); finish(); });
        }).catch(function () { finish(); });
      } else { finish(); }
    } catch (e) { finish(); }

    // 2. Удалить ВСЕ Cache Storage (мёртвые чанки старых сборок)
    try {
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          if (!keys.length) { return finish(); }
          return Promise.all(keys.map(function (k) { return caches.delete(k); }))
            .then(function () { tick('Удалено кэшей: ' + keys.length); finish(); });
        }).catch(function () { finish(); });
      } else { finish(); }
    } catch (e) { finish(); }

    // 3. Разбудить браузерный HTTP-кэш перезагрузкой статики не требуется —
    //    HTML и так must-revalidate; просто фиксируем завершение.
    setTimeout(finish, 1500);

    // Страховка: если что-то зависло — через 6с всё равно показываем кнопку
    setTimeout(function () {
      var btn = document.getElementById('go');
      if (btn) btn.style.display = 'inline-block';
    }, 6000);
  })();
  </script>
</body>
</html>
